<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Output Sanitizer</title>
  <link rel="stylesheet" href="azure-output-sanitizer.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 10V7.2C8 4.9 9.8 3 12 3s4 1.9 4 4.2V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
          </svg>
        </div>

        <div>
          <h1>Azure Output Sanitizer</h1>
          <p>Runs locally in your browser. No network requests are used.</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" type="button" id="clearButton">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9 4h6l1 3H8l1-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          Clear
        </button>

        <button class="btn btn-primary" type="button" id="copyButton">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          Copy sanitized
        </button>
      </div>
    </header>

    <section class="workspace">
      <article class="panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="status-dot blue"></span>
            <span>RAW AZURE OUTPUT</span>
          </div>
          <span class="counter"><span id="inputCount">0</span> characters</span>
        </div>

        <div class="editor-wrap editor-active" id="inputEditorWrap">
          <div class="line-numbers" id="inputLineNumbers">1</div>
          <textarea
            id="input"
            aria-label="Raw Azure output"
            spellcheck="false"
            placeholder="Paste Azure CLI or PowerShell output here..."
          ></textarea>
        </div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="status-dot green"></span>
            <span>SANITIZED OUTPUT</span>
          </div>
          <span class="counter"><span id="outputCount">0</span> characters</span>
        </div>

        <div class="editor-wrap" id="outputEditorWrap">
          <div class="line-numbers" id="outputLineNumbers">1</div>
          <textarea
            id="output"
            aria-label="Sanitized output"
            spellcheck="false"
            readonly
            placeholder="Sanitized text will appear here automatically."
          ></textarea>
        </div>
      </article>
    </section>

    <footer class="footer">
      <div class="footer-left">
        <span class="footer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3 19 6v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Your data stays on your device.</span>
        <span id="status" class="status-text" role="status" aria-live="polite"></span>
      </div>

      <div class="footer-center">
        <span>GUIDs</span>
        <span class="sep">•</span>
        <span>IPv4</span>
        <span class="sep">•</span>
        <span>UPN/Email</span>
        <span class="sep">•</span>
        <span>MAC</span>
        <span class="sep">•</span>
        <span>SSH Keys</span>
      </div>

      <div class="footer-right">
        <span class="info-icon" aria-hidden="true">i</span>
        <span>See README for details</span>
      </div>
    </footer>
  </main>

  <script src="azure-output-sanitizer.js"></script>
</body>
</html>
